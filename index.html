<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta
name="viewport"
content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Work Day Tracker</title>

<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#0f172a">

<link rel="stylesheet" href="styles.css">
</head>

<body>

<div class="app">

<header>
<h1>Work Day Tracker</h1>
<button id="settingsBtn">⚙️</button>
</header>

<section class="hero">

<div class="label">
YOU LEAVE AT
</div>

<div id="finishTime" class="finish-time">
--:--
</div>

<div id="workedToday" class="subtext">
Waiting to start
</div>

<div class="stats">

<div class="stat">
<div class="stat-label">Worked</div>
<div id="workedHours">0h 0m</div>
</div>

<div class="stat">
<div class="stat-label">Break</div>
<div id="breakDisplay">0m</div>
</div>

<div class="stat">
<div class="stat-label">Remaining</div>
<div id="remainingDisplay">0h 0m</div>
</div>

</div>

</section>

<section class="actions">

<label>
Start Work
<input type="time" id="startTime">
</label>

<label>
Break Start
<input type="time" id="breakStart">
</label>

<label>
Break End
<input type="time" id="breakEnd">
</label>

<button id="startNowBtn" class="success">
Start Work Now
</button>

<button id="breakNowBtn" class="warning">
Break Now
</button>

<button id="resumeNowBtn" class="primary">
Resume Now
</button>

<button id="resetBtn" class="danger">
Reset Day
</button>

</section>

<section class="progress-card">

<section class="progress-card">

<h3>Calculation</h3>

<div id="calculationText">
Waiting for start time
</div>

</section>

<div class="progress-header">
Day Progress
</div>

<div class="progress-bar">
<div id="progressFill"></div>
</div>

<div id="progressText">
0%
</div>

</section>

<div id="settingsPanel" class="settings hidden">

<h2>Settings</h2>

<label>
Full Work Day (Hours)
<input
type="number"
step="0.5"
id="dailyHours">
</label>

<button id="saveSettings">
Save
</button>

</div>

</div>

<script src="app.js"></script>

</body>
</html>
